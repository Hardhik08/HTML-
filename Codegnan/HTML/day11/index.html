<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        Dashboard
    </header>

    <aside class="sidebar">
        <h2>Menu</h2>
        <ul>
            <li>Home</li>
            <li>Profile</li>
            <li>Projects</li>
            <li>Settings</li>
        </ul>
    </aside>

    <main class="main">

        <div class="cards">

            <div class="card">HTML</div>
            <div class="card">CSS</div>
            <div class="card">JavaScript</div>
            <div class="card">Python</div>

        </div>

        <div class="content">

            <div class="box">
                Recent Activity
            </div>

            <div class="box">
                Performance
            </div>

        </div>

    </main>

    <footer class="footer">
        © 2026 Hardhik Kurumaddali
    </footer>

</div>

</body>
</html>
