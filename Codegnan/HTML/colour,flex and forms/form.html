<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form by Hardhik</title>
</head>
<body>
    <form> <h1 style="font-size: 35px;">Create your Account</h1> <br><br><br><br>
        
        
        <!-- Text Inputs -->
        <label for="Full Name" >Full Name:</label>
        <input type="text" placeholder="Full Name" name="Name" required>
        <br><br>
        <label for="Email Address">Email Address:</label>
        <input type="email" required>
        <br><br>
        <label for="Password">Create a Password:</label>
        <input type="password" required>
        <br><br>


        <!-- Radio Buttons  -->
        <label for="gender">Gender: <br></label>
        <input type="radio" name="Gen">Male <br>
        <input type="radio" name="Gen">Female <br>
        <input type="radio" name="Gen">Others <br><br>

        <!-- DropDown Menu -->
        <label for="country"> <strong>Country:</strong></label>
        <select name="Country" id="">
            <option value="select">Select</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select>
        <br><br>

        <!-- Description -->
        <label for="Desc">Description:</label>


        <!-- Text Area -->
        <textarea name="" id=""></textarea>
        <br><br>

        <!-- Submit Button -->
        <button type="submit" >SUBMIT</button>


        <!-- Reset BUtton -->
         <button type="reset" >RESET</button>

    </form>
</body>
</html>
