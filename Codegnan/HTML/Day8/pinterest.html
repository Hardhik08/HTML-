<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest</title>

    <link rel="stylesheet" href="pinterest.css">

    <link rel="icon" href="./image.png">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <nav>

        <div class="leftnav">

            <div class="logo">
                <i class="fa-brands fa-pinterest"></i>
                <a href="#">Pinterest</a>
            </div>

            <a href="#">Explore</a>

        </div>

        <div class="search">

            <input type="text" placeholder="Search">

        </div>

        <div class="rightnav">

            <a href="#">About</a>
            <a href="#">Business</a>
            <a href="#">Create</a>
            <a href="#">News</a>

            <button class="login">Login</button>
            <button class="signup">Signup</button>

        </div>

    </nav>


    <section class="hero">

        <div class="leftHero">

            <h1>Create the life you love on Pinterest</h1>

            <p>
                Find recipes, home inspiration, style ideas and
                other ideas to try.
            </p>

            <button class="joinBtn">
                Join Pinterest for free
            </button>

            <button class="accountBtn">
                I already have an account
            </button>

        </div>

        <div class="rightHero">

            <img src="./8c32334fb2b4fc8941a2abbff9678411.jpg">

        </div>

    </section>

</body>
</html>
